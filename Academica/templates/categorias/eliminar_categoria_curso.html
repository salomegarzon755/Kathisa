{% extends 'base.html' %}

{% block title %}Eliminar categoría{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Eliminar categoría</h2>

    <p>
        ¿Estás segura de que deseas eliminar la categoría
        <strong>{{ categoria.category_name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Sí, eliminar
        </button>

        <a href="{% url 'lista_categoria_cursos' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>

{% endblock %}
