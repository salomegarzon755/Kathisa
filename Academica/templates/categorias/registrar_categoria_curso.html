{% extends 'base.html' %}

{% block title %}Registrar categoraa{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Registrar categoria de curso</h2>

    <form method="POST">
        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit" class="btn btn-primary">
            Registrar
        </button>

        <a href="{% url 'lista_categoria_cursos' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
